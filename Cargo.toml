[package]
name = "rmus"
version = "0.1.2"
description = "Music Player TUI"
authors = ["Maximilian PINDER-WHITE <mpinderwhite@proton.me>"]
license = "MIT"
edition = "2021"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.0"
color-eyre = "0.6.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
directories = "6.0"
lofty = "0.22.4"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22.1"
md5 = "0.8.0"
regex = "1.10"
chrono = "0.4"
serde_json = "1.0"
rand = "0.9"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
